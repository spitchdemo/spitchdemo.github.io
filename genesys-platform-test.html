<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesys Test</title>

    <!-- 1. Client App SDK -->
    <script src="./purecloud-client-app-sdk.js"></script>

    <!-- 2. Platform SDK (Browser-CJS-Version) -->
    <script src="./purecloud-platform-client-v2.min.js"></script>

    <!-- 3. Test-Skript -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            try {
                // Wichtig: über require() holen, nicht window.platformClient
                const platformClient = require('platformClient');

                if (platformClient && platformClient.ApiClient) {
                    console.log("✅ Platform SDK erfolgreich geladen!");
                    console.log("ApiClient verfügbar:", !!platformClient.ApiClient);
                    
                    // Beispiel:
                    // const client = platformClient.ApiClient.instance;
                } else {
                    console.error("❌ Platform SDK geladen, aber ApiClient fehlt.");
                }
            } catch (e) {
                console.error("❌ Fehler beim Laden des Platform SDK:", e);
            }
        });
    </script>
</head>
