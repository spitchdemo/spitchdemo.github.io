<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Call Script iFrame</title>
    <!-- 1. Offizielles Genesys Client App SDK einbinden -->
    <script src="https://sdk-cdn.mypurecloud.com/client-app-sdk/v2/purecloud-client-app-sdk.js"></script>
</head>
<body>
	Genesys Desktop
    <pre id="log"></pre>

    <script>
        function log(msg) {
            document.getElementById("log").textContent += msg + "\n";
        }

        // 2. SDK initialisieren (ohne window.parent zu berühren)
        const ClientApp = window.purecloud.apps.ClientApp;
        const myApp = new ClientApp({
            pcEnvironment: 'mypurecloud.de' // Passen Sie Ihre Region an (z. B. mypurecloud.de, mypurecloud.ie)
        });

        log("App erfolgreich im Genesys Desktop registriert.");

        // 3. Beispiel: Auf Fokus-Events des iFrames reagieren
        myApp.lifecycle.addFocusListener(() => {
            log("iFrame hat Fokus erhalten");
        });
    </script>
</body>
</html>
