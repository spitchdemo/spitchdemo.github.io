<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesys Live Call & Status Monitor</title>

    <!-- 1. Genesys Client App SDK v2 (jsDelivr) -->
    <script src="https://cdn.jsdelivr.net/npm/purecloud-client-app-sdk@2.6.0/dist/purecloud-client-app-sdk.js"></script>
    
    <!-- 2. Genesys Platform Client SDK (Web Bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/purecloud-platform-client-v2/dist/web-cjs/purecloud-platform-client-v2.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            margin: 0;
            padding: 12px;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            margin-bottom: 12px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Call Status Farben */
        .state-idle { background: #dfe1e6; color: #42526e; }
        .state-alerting { background: #ffab00; color: #fff; }
        .state-connected { background: #36b37e; color: #fff; }
        .state-disconnected { background: #ff5630; color: #fff; }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .label { color: #6b778c; font-weight: 500; }
        .value { font-weight: 600; font-family: monospace; color: #172b4d; }

        .log-box {
            background: #1e1e1e;
            color: #4af626;
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            border-radius: 6px;
            height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <!-- 1. Live Dashboard -->
    <div class="card">
        <div class="status-header">
            <div>
                <span class="label">Agent Presence:</span>
                <strong id="agentPresence" style="color: #0052cc;">Initialisiere...</strong>
            </div>
            <span id="callStateBadge" class="badge state-idle">IDLE</span>
        </div>

        <div class="data-row">
            <span class="label">Call Status:</span>
            <span id="callStatusText" class="value">Kein aktiver Anruf</span>
        </div>
        <div class="data-row">
            <span class="label">Interaction ID:</span>
            <span id="interactionId" class="value">-</span>
        </div>
        <div class="data-row">
            <span class="label">Anrufer (ANI):</span>
            <span id="customerNumber" class="value">-</span>
        </div>
        <div class="data-row">
            <span class="label">Agent Email:</span>
            <span id="agentEmail" class="value">-</span>
        </div>
    </div>

    <!-- 2. Live Log-Konsole -->
    <div class="log-box" id="log">--- System Log gestartet ---<br></div>

    <script>
        // OAuth Client ID aus Genesys Admin
        const CLIENT_ID = '83accf17-8af6-4c0a-9b69-2fca2010fa21'; 
        const ENVIRONMENT = 'mypurecloud.ie'; // Irland Region

        function log(msg) {
            const logElem = document.getElementById("log");
            const time = new Date().toLocaleTimeString();
            logElem.innerHTML += `[${time}] ${msg}<br>`;
            logElem.scrollTop = logElem.scrollHeight;
            console.log(msg);
        }

        function updateCallUI(state, text) {
            const badge = document.getElementById("callStateBadge");
            const statusText = document.getElementById("callStatusText");

            statusText.textContent = text;
            badge.textContent = state.toUpperCase();
            
            badge.className = "badge " + (
                state === 'alerting' ? 'state-alerting' :
                state === 'connected' ? 'state-connected' :
                state === 'disconnected' ? 'state-disconnected' : 'state-idle'
            );
        }

        window.addEventListener('DOMContentLoaded', async () => {
            // A. URL-Parameter auslesen (aus Script-Designer übergeben)
            const urlParams = new URLSearchParams(window.location.search);
            const initInteractionId = urlParams.get('interactionId') || 'Nicht übergeben';
            const initCustomerNumber = urlParams.get('customerNumber') || 'Nicht übergeben';
            const initAgentEmail = urlParams.get('agentEmail') || 'Nicht übergeben';

            document.getElementById("interactionId").textContent = initInteractionId;
            document.getElementById("customerNumber").textContent = initCustomerNumber;
            document.getElementById("agentEmail").textContent = initAgentEmail;

            // B. Client App SDK verbinden
            try {
                const ClientApp = (window.purecloud && window.purecloud.apps && window.purecloud.apps.ClientApp) || window.ClientApp;
                if (ClientApp) {
                    const myApp = new ClientApp({ pcEnvironment: ENVIRONMENT });
                    log("✓ Client App SDK initialisiert");
                }
            } catch (err) {
                log("⚠️ Client App SDK Warnung: " + err.message);
            }

            // C. Authentifizierung & WebSockets starten
            initGenesysNotifications();
        });

        async function initGenesysNotifications() {
            try {
                const platformClient = window.platformClient;
                if (!platformClient) {
                    log("❌ Fehler: Genesys Platform SDK nicht geladen.");
                    return;
                }

                const client = platformClient.ApiClient.instance;
                client.setEnvironment(ENVIRONMENT);

                // Dynamische Redirect-URI ermitteln (ohne Query-Parameter)
                const redirectUri = window.location.href.split('?')[0].split('#')[0];

                // Prüfen, ob wir mit einem Authorization Code von der Login-Seite zurückkehren
                const urlParams = new URLSearchParams(window.location.search);
                const authCode = urlParams.get('code');

                if (authCode) {
                    log("🔑 Authorization Code empfangen. Tausche Code via PKCE ein...");
                    await client.loginCodeAuthorization(CLIENT_ID, redirectUri, { authCode: authCode });
                    
                    // URL-Parameter im Browser säubern
                    window.history.replaceState({}, document.title, redirectUri);
                    log("✓ PKCE Authentifizierung erfolgreich!");

                } else if (!client.authData || !client.authData.accessToken) {
                    log("🔄 Kein Token vorhanden. Leite zum PKCE Login weiter...");
                    client.loginCodeAuthorization(CLIENT_ID, redirectUri);
                    return;
                }

                // --- AB HIER: Authentifiziert ---
                const usersApi = new platformClient.UsersApi();
                const notificationsApi = new platformClient.NotificationsApi();

                // 1. Agenten-Details laden
                log("Lade Agenten-Profil...");
                const me = await usersApi.getUsersMe();
                document.getElementById("agentEmail").textContent = me.email || '-';
                log(`✓ Agent angemeldet: ${me.name}`);

                // 2. WebSocket Channel erstellen
                const channel = await notificationsApi.postNotificationsChannels();
                log("✓ WebSocket Channel geöffnet");

                const socket = new WebSocket(channel.connectUri);

                socket.onopen = async () => {
                    log("🟢 WebSocket verbunden! Registriere Topics...");

                    const topics = [
                        { id: `v2.users.${me.id}.conversations` },
                        { id: `v2.users.${me.id}.presence` }
                    ];

                    await notificationsApi.postNotificationsChannelSubscriptions(channel.id, topics);
                    log("✓ Realtime-Events aktiv!");
                };

                // 3. Empfang von Live-Events
                socket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    const topic = data.topicName;

                    // Anrufevents (Connected, Ringing, Hangup)
                    if (topic && topic.includes('conversations')) {
                        const conversation = data.eventBody;
                        const callParticipant = conversation.participants.find(p => p.purpose === 'customer' || p.purpose === 'external');
                        
                        if (callParticipant && callParticipant.calls && callParticipant.calls.length > 0) {
                            const call = callParticipant.calls[0];
                            const state = call.state;

                            document.getElementById("interactionId").textContent = conversation.id;
                            if (callParticipant.ani) {
                                document.getElementById("customerNumber").textContent = callParticipant.ani;
                            }

                            if (state === 'alerting') {
                                updateCallUI('alerting', '🔔 Klingelt...');
                                log(`[CALL] Eingehender Anruf von: ${callParticipant.ani}`);
                            } else if (state === 'connected') {
                                updateCallUI('connected', '📞 Gespräch aktiv');
                                log('[CALL] Gespräch verbunden');
                            } else if (state === 'disconnected' || state === 'terminated') {
                                updateCallUI('disconnected', '🔴 Aufgelegt');
                                log('[CALL] Gespräch beendet');
                                
                                setTimeout(() => updateCallUI('idle', 'Kein aktiver Anruf'), 4000);
                            }
                        }
                    }

                    // Agent Presence Events (Ready, Away, Busy etc.)
                    if (topic && topic.includes('presence')) {
                        const presence = data.eventBody.presenceDefinition.systemPresence;
                        document.getElementById("agentPresence").textContent = presence;
                        log(`[PRESENCE] Neuer Status: ${presence}`);
                    }
                };

                socket.onerror = (err) => {
                    log("❌ WebSocket Fehler: " + JSON.stringify(err));
                };

            } catch (err) {
                log("❌ Authentifizierungs-/API-Fehler: " + (err.message || JSON.stringify(err)));
            }
        }
    </script>
</body>
</html>
