<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesys Live Call & Status Monitor</title>

    <!-- 1. Client App SDK (Lokal) -->
    <script src="./purecloud-client-app-sdk.js"></script>

    <!-- 2. Platform SDK (Lokal - CommonJS Browser Bundle) -->
    <script src="./purecloud-platform-client-v2.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            margin: 0;
            padding: 12px;
        }
        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            margin-bottom: 12px;
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .state-idle { background: #dfe1e6; color: #42526e; }
        .state-alerting { background: #ffab00; color: #fff; }
        .state-connected { background: #36b37e; color: #fff; }
        .state-disconnected { background: #ff5630; color: #fff; }
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .data-row:last-child { border-bottom: none; }
        .label { color: #6b778c; font-weight: 500; }
        .value { font-weight: 600; font-family: monospace; color: #172b4d; }
        .log-box {
            background: #1e1e1e;
            color: #4af626;
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            border-radius: 6px;
            height: 140px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <!-- Live Dashboard -->
    <div class="card">
        <div class="status-header">
            <div>
                <span class="label">Agent Presence:</span>
                <strong id="agentPresence" style="color: #0052cc;">Initialisiere...</strong>
            </div>
            <span id="callStateBadge" class="badge state-idle">IDLE</span>
        </div>
        <div class="data-row">
            <span class="label">Call Status:</span>
            <span id="callStatusText" class="value">Kein aktiver Anruf</span>
        </div>
        <div class="data-row">
            <span class="label">Interaction ID:</span>
            <span id="interactionId" class="value">-</span>
        </div>
        <div class="data-row">
            <span class="label">Anrufer (ANI):</span>
            <span id="customerNumber" class="value">-</span>
        </div>
        <div class="data-row">
            <span class="label">Agent Email:</span>
            <span id="agentEmail" class="value">-</span>
        </div>
    </div>

    <!-- Live Log Console -->
    <div class="log-box" id="log">--- System Log gestartet ---<br></div>

    <script>
        // ============================================================
        // KONFIGURATION – bitte anpassen
        // ============================================================
        const CLIENT_ID = 'IHRE_CLIENT_ID_HIER_EINTRAGEN';   // OAuth Client ID (PKCE / Code Authorization)
        const ENVIRONMENT = 'mypurecloud.ie';                 // Region (z.B. mypurecloud.ie, mypurecloud.de, ...)

        // ============================================================
        // Hilfsfunktionen
        // ============================================================
        function log(msg) {
            const logElem = document.getElementById("log");
            const time = new Date().toLocaleTimeString();
            logElem.innerHTML += `[${time}] ${msg}<br>`;
            logElem.scrollTop = logElem.scrollHeight;
            console.log(msg);
        }

        function updateCallUI(state, text) {
            const badge = document.getElementById("callStateBadge");
            const statusText = document.getElementById("callStatusText");

            statusText.textContent = text;
            badge.textContent = state.toUpperCase();

            badge.className = "badge " + (
                state === 'alerting'     ? 'state-alerting' :
                state === 'connected'    ? 'state-connected' :
                state === 'disconnected' ? 'state-disconnected' : 'state-idle'
            );
        }

        // ============================================================
        // Start
        // ============================================================
        window.addEventListener('DOMContentLoaded', async () => {

            // A. Query-Parameter auslesen (falls von Genesys übergeben)
            const urlParams = new URLSearchParams(window.location.search);
            document.getElementById("interactionId").textContent  = urlParams.get('interactionId')  || 'Nicht übergeben';
            document.getElementById("customerNumber").textContent = urlParams.get('customerNumber') || 'Nicht übergeben';
            document.getElementById("agentEmail").textContent     = urlParams.get('agentEmail')     || 'Nicht übergeben';

            // B. Client App SDK (optional – nur relevant wenn App in Genesys eingebettet läuft)
            try {
                let ClientApp = null;

                if (typeof require === 'function') {
                    try {
                        ClientApp = require('purecloud-client-app-sdk');
                    } catch (e) { /* ignore */ }
                }

                if (!ClientApp) {
                    ClientApp = (window.purecloud && window.purecloud.apps && window.purecloud.apps.ClientApp)
                             || window.ClientApp;
                }

                if (ClientApp) {
                    const myApp = new ClientApp({ pcEnvironment: ENVIRONMENT });
                    log("✓ Client App SDK erfolgreich initialisiert");
                } else {
                    log("ℹ️ Client App SDK nicht gefunden (ok, wenn App standalone läuft)");
                }
            } catch (err) {
                log("⚠️ Client App SDK Warnung: " + err.message);
            }

            // C. Platform SDK + Auth + Notifications
            await initGenesysNotifications();
        });

        // ============================================================
        // Platform SDK + PKCE Auth + WebSocket
        // ============================================================
        async function initGenesysNotifications() {
            try {
                // 1. Platform SDK laden
                if (typeof require !== 'function') {
                    log("❌ Fehler: require() ist nicht verfügbar. Ist purecloud-platform-client-v2.min.js geladen?");
                    return;
                }

                const platformClient = require('platformClient');

                if (!platformClient || !platformClient.ApiClient) {
                    log("❌ Fehler: Platform SDK geladen, aber ApiClient fehlt.");
                    return;
                }

                log("✅ Platform SDK via require('platformClient') geladen!");

                const client = platformClient.ApiClient.instance;
                client.setEnvironment(ENVIRONMENT);

                // Saubere Redirect-URI (ohne Query und Hash)
                const redirectUri = window.location.origin + window.location.pathname;

                // ----------------------------------------------------
                // 2. PKCE Authentifizierung (Browser)
                // ----------------------------------------------------
                // loginPKCEGrant erkennt automatisch, ob ein ?code=... in der URL ist
                // und tauscht den Code gegen ein Access Token.
                // Wenn kein Token vorhanden ist, leitet es zum Login um.

                const hasToken = client.authData && client.authData.accessToken;

                if (!hasToken) {
                    log("🔄 Starte / setze PKCE-Login fort...");

                    // Optional: state mitgeben, falls du nach dem Redirect etwas wiederherstellen willst
                    await client.loginPKCEGrant(CLIENT_ID, redirectUri, {
                        // state: 'optional-state-string'
                    });

                    // Nach erfolgreichem Login die URL bereinigen (code + state entfernen)
                    window.history.replaceState({}, document.title, redirectUri);
                    log("✓ PKCE Authentifizierung erfolgreich!");
                } else {
                    log("✓ Bereits authentifiziert (Token vorhanden)");
                }

                // ----------------------------------------------------
                // 3. Agenten-Profil laden
                // ----------------------------------------------------
                const usersApi = new platformClient.UsersApi();
                const notificationsApi = new platformClient.NotificationsApi();

                log("Lade Agenten-Profil...");
                const me = await usersApi.getUsersMe();
                document.getElementById("agentEmail").textContent = me.email || '-';
                log(`✓ Agent angemeldet: ${me.name} (${me.email})`);

                // ----------------------------------------------------
                // 4. WebSocket Channel öffnen
                // ----------------------------------------------------
                const channel = await notificationsApi.postNotificationsChannels();
                log("✓ WebSocket Channel geöffnet");

                const socket = new WebSocket(channel.connectUri);

                socket.onopen = async () => {
                    log("🟢 WebSocket verbunden! Registriere Topics...");

                    const topics = [
                        { id: `v2.users.${me.id}.conversations` },
                        { id: `v2.users.${me.id}.presence` }
                    ];

                    await notificationsApi.postNotificationsChannelSubscriptions(channel.id, topics);
                    log("✓ Realtime-Events aktiv!");
                };

                socket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        const topic = data.topicName || '';

                        // ---- Conversations ----
                        if (topic.includes('conversations')) {
                            const conversation = data.eventBody;
                            if (!conversation || !conversation.participants) return;

                            // Kunde / External Participant suchen
                            const callParticipant = conversation.participants.find(
                                p => p.purpose === 'customer' || p.purpose === 'external'
                            );

                            if (callParticipant && callParticipant.calls && callParticipant.calls.length > 0) {
                                const call = callParticipant.calls[0];
                                const state = call.state;

                                document.getElementById("interactionId").textContent = conversation.id || '-';

                                if (callParticipant.ani) {
                                    document.getElementById("customerNumber").textContent = callParticipant.ani;
                                }

                                if (state === 'alerting') {
                                    updateCallUI('alerting', '🔔 Klingelt...');
                                    log(`[CALL] Eingehender Anruf: ${callParticipant.ani || 'unbekannt'}`);
                                } else if (state === 'connected') {
                                    updateCallUI('connected', '📞 Gespräch aktiv');
                                    log('[CALL] Gespräch verbunden');
                                } else if (state === 'disconnected' || state === 'terminated') {
                                    updateCallUI('disconnected', '🔴 Aufgelegt');
                                    log('[CALL] Gespräch beendet');
                                    setTimeout(() => updateCallUI('idle', 'Kein aktiver Anruf'), 4000);
                                }
                            }
                        }

                        // ---- Presence ----
                        if (topic.includes('presence') && data.eventBody && data.eventBody.presenceDefinition) {
                            const presence = data.eventBody.presenceDefinition.systemPresence;
                            document.getElementById("agentPresence").textContent = presence;
                            log(`[PRESENCE] Status: ${presence}`);
                        }
                    } catch (parseErr) {
                        log("⚠️ Fehler beim Verarbeiten einer WebSocket-Nachricht: " + parseErr.message);
                    }
                };

                socket.onerror = (err) => {
                    log("❌ WebSocket Fehler");
                    console.error(err);
                };

                socket.onclose = () => {
                    log("🔌 WebSocket geschlossen");
                };

            } catch (err) {
                log("❌ Fehler: " + (err.message || JSON.stringify(err)));
                console.error(err);
            }
        }
    </script>
</body>
</html>
